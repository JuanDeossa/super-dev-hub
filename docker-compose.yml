services:
  postgres:
    image: postgres:16
    restart: always
    env_file:
      - ./server/.env
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8080:8080"
    env_file:
      - ./server/.env
    depends_on:
      - postgres

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "5173:5173"
    env_file:
      - ./client/.env.local
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4:8
    restart: always
    env_file:
      - ./server/.env
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data: